services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: my_portal
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ローカルでContactフォームのメール送信をテストするためのSMTPキャッチャー。
  # 実際には外部に送信せず、Web UI（http://localhost:8025）で受信内容を確認できる。
  # server/.env.example の CONTACT_SMTP_* をこのコンテナ向けに設定して使う。
  mailpit:
    image: axllent/mailpit:v1
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH: contact:contact
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql_data:
