# AWS Lightsail (Instance) 上でNext.js / Go API / MySQL / Caddyをまとめて動かす本番用構成。
# ローカル開発用の docker-compose.yml（MySQLのみ）とは別ファイル。
#
# api/web は GitHub Actions（.github/workflows/deploy.yml）がビルドしてGHCRにpushした
# イメージ（image:）を参照する。mainへのマージ後、CIが通ると自動でビルド・push・
# Lightsailへのデプロイまで走る（`docker compose pull` → `run --rm migrate up` →
# `up -d`）。手動で動かす／CIを使わない場合は build: が残っているのでそのままローカル
# ビルドもできる:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml build
#   docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm migrate up
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d mysql api web caddy
#
# migrateサービスは常時起動させたくないので、`up`の対象から明示的に外し、
# 実行したいときだけ `run --rm migrate up|down` で呼び出す。
#
# GHCRのパッケージ（ghcr.io/matsutoba/my-portal-web, -api）は初回push後に
# Public に設定しておくこと（Lightsail側でdocker loginせずにpullできるようにするため）。
#
# .env.prod（git管理しない）に以下を定義する:
#   DOMAIN=example.com
#   MYSQL_ROOT_PASSWORD=...
#   MYSQL_PASSWORD=...
#   CRON_SECRET=...
#   READ_ONLY=true   # 公開デモを読み取り専用にする場合のみ設定（POST/PUT/PATCH/DELETEを403で拒否）
#   CONTACT_SMTP_HOST=...      # Contactフォーム送信用（AWS SESのSMTPインターフェース想定）
#   CONTACT_SMTP_PORT=...
#   CONTACT_SMTP_USERNAME=...
#   CONTACT_SMTP_PASSWORD=...
#   CONTACT_FROM_EMAIL=...     # SESで検証済みの送信元アドレス
#   CONTACT_TO_EMAIL=...       # 問い合わせを転送したい受信先アドレス
#
# Lightsailインスタンスの（静的）IPアドレスが変わったときの手順:
#   1. Lightsailコンソールでインスタンスの現在のパブリックIPを確認する
#      （インスタンス上で `curl -4 ifconfig.me` でも確認できる）
#   2. sslip.io等IPベースのドメインを使っている場合、.env.prod の DOMAIN を
#      新しいIPに合わせて更新する（例: 1.2.3.4.sslip.io）
#      独自ドメインを使っている場合は、DNSのAレコードを新しいIPに向ける
#   3. Caddyを再作成して新しいドメインで証明書を取り直させる
#        docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --force-recreate caddy
#   4. ログで証明書取得が成功しているか確認する
#        docker compose --env-file .env.prod -f docker-compose.prod.yml logs caddy --tail=30 -f

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: my_portal
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: ghcr.io/matsutoba/my-portal-api:latest
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://app:${MYSQL_PASSWORD}@tcp(mysql:3306)/my_portal
      ALLOWED_ORIGIN: https://${DOMAIN}
      CRON_SECRET: ${CRON_SECRET}
      READ_ONLY: ${READ_ONLY:-false}
      GIN_MODE: release
      CONTACT_SMTP_HOST: ${CONTACT_SMTP_HOST}
      CONTACT_SMTP_PORT: ${CONTACT_SMTP_PORT}
      CONTACT_SMTP_USERNAME: ${CONTACT_SMTP_USERNAME}
      CONTACT_SMTP_PASSWORD: ${CONTACT_SMTP_PASSWORD}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL}
    depends_on:
      mysql:
        condition: service_healthy

  # DBマイグレーション用。常時起動はさせず、必要なときだけ `run --rm migrate up|down` で叩く
  migrate:
    image: ghcr.io/matsutoba/my-portal-api:latest
    build:
      context: ./server
    entrypoint: ["/usr/local/bin/migrate"]
    environment:
      DATABASE_URL: mysql://app:${MYSQL_PASSWORD}@tcp(mysql:3306)/my_portal
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: ghcr.io/matsutoba/my-portal-web:latest
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${DOMAIN}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
